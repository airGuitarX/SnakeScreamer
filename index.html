<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SSnake — 可自定义的浏览器贪吃蛇游戏。" data-i18n="metaDescriptionMenu">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <title>SSnake</title>
  </head>
  <body class="menu-page" data-i18n-title="pageTitleMenu">
    <main class="menu">
      <p class="menu-eyebrow" data-i18n="menuEyebrow">TFA小游戏</p>
      <h1 class="menu-title" data-i18n="menuTitle">SSnake</h1>
      <p class="menu-tagline" data-i18n="menuTagline">
        成为扭力达？就在今天
      </p>

      <section class="mode-panel" data-i18n-aria="modeOptionsAria" aria-label="模式选项">
        <a class="btn btn-mode" href="game.html" data-start-mode="normal" data-i18n="modeNormal">普通模式</a>
        <a class="btn btn-mode" href="game.html" data-start-mode="hard" data-i18n="modeHard">困难模式</a>
        <a class="btn btn-mode btn-mega-mode" href="game.html" data-start-mode="mega" data-i18n="modeMega">Mega模式</a>
      </section>

      <nav class="menu-actions" data-i18n-aria="menuActionsAria" aria-label="游戏选项">
        <button
          type="button"
          class="btn btn-lang"
          id="lang-switch"
          data-i18n-aria="langSwitchAria"
          aria-label="切换语言"
        >
          English
        </button>
      </nav>

      <p class="menu-hint" data-i18n="menuHint">需要键盘 · 方向键移动</p>
    </main>

    <script src="js/i18n.js" type="text/javascript"></script>
    <script src="js/game-config.js" type="text/javascript"></script>
    <script src="js/game-modes.js" type="text/javascript"></script>
  </body>
</html>
