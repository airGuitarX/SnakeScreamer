<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="玩 SSnake — 浏览器里的经典贪吃蛇。" data-i18n="metaDescriptionGame">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <title>SSnake — 游戏中</title>
  </head>
  <body class="game-page" data-i18n-title="pageTitleGame">
    <header class="game-header hideable">
      <a class="back-link" href="index.html" data-i18n="backToMenu">← 菜单</a>
      <h1 data-i18n="menuTitle">SSnake</h1>
    </header>

    <p class="score" id="score">得分：0000</p>
    <div class="game-board">
      <canvas data-i18n-aria="canvasAria" aria-label="贪吃蛇游戏区域"></canvas>
      <div id="effect-popups" class="effect-popups" aria-live="polite"></div>
    </div>

    <nav class="touch-controls" data-i18n-aria="touchControlsAria" aria-label="Touch controls">
      <button type="button" class="touch-btn touch-up" data-direction="up" data-i18n-aria="moveUp" aria-label="Up">↑</button>
      <button type="button" class="touch-btn touch-left" data-direction="left" data-i18n-aria="moveLeft" aria-label="Left">←</button>
      <button type="button" class="touch-btn touch-right" data-direction="right" data-i18n-aria="moveRight" aria-label="Right">→</button>
      <button type="button" class="touch-btn touch-down" data-direction="down" data-i18n-aria="moveDown" aria-label="Down">↓</button>
    </nav>

    <p class="game-footer">
      <span data-i18n="gameFooter">吃到食物变长，避开墙壁和自己的身体。</span>
    </p>

    <div
      id="game-over"
      class="game-over hidden"
      hidden
      role="dialog"
      aria-modal="true"
      data-i18n-aria="gameOverAria"
      aria-label="游戏结束"
    >
      <div class="game-over-panel">
        <h2 class="game-over-title" data-i18n="gameOverTitle">游戏结束</h2>

        <dl class="game-over-stats">
          <div class="game-over-stat">
            <dt data-i18n="currentScoreLabel">本次得分</dt>
            <dd id="game-over-score">0</dd>
          </div>
          <div class="game-over-stat">
            <dt data-i18n="highScoreLabel">最高分</dt>
            <dd id="game-over-high">0</dd>
          </div>
        </dl>

        <p id="game-over-record" class="game-over-record hidden" data-i18n="newHighScore">新纪录！</p>
        <p id="game-over-mode" class="game-over-mode"></p>

        <nav class="game-over-actions" data-i18n-aria="gameOverActionsAria" aria-label="游戏结束选项">
          <button type="button" class="btn btn-primary" id="play-again" data-i18n="playAgain">再玩一次</button>
          <a class="btn btn-lang" href="index.html" data-i18n="backToMenu">← 菜单</a>
        </nav>
      </div>
    </div>

    <div
      id="win-menu"
      class="win-menu hidden"
      hidden
      role="dialog"
      aria-modal="true"
      data-i18n-aria="winAria"
      aria-label="胜利"
    >
      <div class="game-over-panel">
        <h2 class="game-over-title" data-i18n="winTitle">你赢了！</h2>
        <img id="win-picture" class="win-picture" alt="">

        <dl class="game-over-stats">
          <div class="game-over-stat">
            <dt data-i18n="currentScoreLabel">本次得分</dt>
            <dd id="win-score">0</dd>
          </div>
          <div class="game-over-stat">
            <dt data-i18n="highScoreLabel">最高分</dt>
            <dd id="win-high">0</dd>
          </div>
        </dl>

        <p id="win-record" class="game-over-record hidden" data-i18n="newHighScore">新纪录！</p>
        <p id="win-mode" class="game-over-mode"></p>

        <nav class="game-over-actions" data-i18n-aria="winActionsAria" aria-label="胜利选项">
          <button type="button" class="btn btn-primary" id="win-play-again" data-i18n="playAgain">再玩一次</button>
          <a class="btn btn-lang" href="index.html" data-i18n="backToMenu">← 菜单</a>
        </nav>
      </div>
    </div>

    <script src="js/i18n.js" type="text/javascript"></script>
    <script src="js/game-config.js" type="text/javascript"></script>
    <script src="js/game-modes.js" type="text/javascript"></script>
    <script src="js/game-rules.js" type="text/javascript"></script>
    <script src="js/animations.js" type="text/javascript"></script>
    <script src="js/assets.js" type="text/javascript"></script>
    <script src="js/snake.js" type="text/javascript"></script>
  </body>
</html>
