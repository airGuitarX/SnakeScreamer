<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="玩 SSnake — 浏览器里的经典贪吃蛇。" data-i18n="metaDescriptionGame">
    <link href="css/styles.css" rel="stylesheet" type="text/css">
    <title>SSnake — 游戏中</title>
  </head>
  <body class="game-page" data-i18n-title="pageTitleGame">
    <header class="game-header hideable">
      <a class="back-link" href="index.html" data-i18n="backToMenu">← 菜单</a>
      <h1 data-i18n="menuTitle">SSnake</h1>
    </header>

    <p class="score" id="score">得分：0000</p>
    <canvas data-i18n-aria="canvasAria" aria-label="贪吃蛇游戏区域"></canvas>

    <p class="game-footer hideable">
      <span data-i18n="gameFooter">吃到食物变长，避开墙壁和自己的身体。</span>
      <br>
      <span class="game-footer-note" data-i18n="gameFooterNote">方向键控制 · 按反方向可暂停</span>
    </p>

    <div
      id="game-over"
      class="game-over hidden"
      hidden
      role="dialog"
      aria-modal="true"
      data-i18n-aria="gameOverAria"
      aria-label="游戏结束"
    >
      <div class="game-over-panel">
        <h2 class="game-over-title" data-i18n="gameOverTitle">游戏结束</h2>

        <dl class="game-over-stats">
          <div class="game-over-stat">
            <dt data-i18n="currentScoreLabel">本次得分</dt>
            <dd id="game-over-score">0</dd>
          </div>
          <div class="game-over-stat">
            <dt data-i18n="highScoreLabel">最高分</dt>
            <dd id="game-over-high">0</dd>
          </div>
        </dl>

        <p id="game-over-record" class="game-over-record hidden" data-i18n="newHighScore">新纪录！</p>

        <nav class="game-over-actions" data-i18n-aria="gameOverActionsAria" aria-label="游戏结束选项">
          <button type="button" class="btn btn-primary" id="play-again" data-i18n="playAgain">再玩一次</button>
          <a class="btn btn-lang" href="index.html" data-i18n="backToMenu">← 菜单</a>
        </nav>
      </div>
    </div>

    <script src="js/i18n.js" type="text/javascript"></script>
    <script src="js/game-config.js" type="text/javascript"></script>
    <script src="js/animations.js" type="text/javascript"></script>
    <script src="js/assets.js" type="text/javascript"></script>
    <script src="js/snake.js" type="text/javascript"></script>
  </body>
</html>
