<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Play SSnake — a simple snake game in your browser.">
    <link href="snake.css" rel="stylesheet" type="text/css">
    <title>SSnake — Play</title>
  </head>
  <body class="game-page">
    <header class="game-header hideable">
      <a class="back-link" href="index.html">← Menu</a>
      <h1>SSnake</h1>
    </header>

    <p class="score" id="score">SCORE: 0000</p>
    <canvas aria-label="Snake game board"></canvas>

    <p class="game-footer hideable">
      Collect segments to grow. Avoid walls and your own tail.
      <br>
      <span class="game-footer-note">Arrow keys · Press opposite direction to pause</span>
    </p>

    <script src="snake.js" type="text/javascript"></script>
  </body>
</html>
